  <ellipse cx="110" cy="80" rx="35" ry="25" fill="white"/>
  <ellipse cx="50" cy="80" rx="30" ry="20" fill="white"/>
  
  <ellipse cx="380" cy="120" rx="40" ry="30" fill="white"/>
  <ellipse cx="410" cy="120" rx="35" ry="25" fill="white"/>
  <ellipse cx="350" cy="120" rx="30" ry="20" fill="white"/>
  
  <!-- Tree -->
  <path d="M350 380 Q380 250 400 150 Q350 180 340 120 Q300 170 250 150 Q240 190 200 170 Q180 220 150 180 L200 380 Z" fill="#8B4513"/>
  
  <!-- Tree leaves -->
